<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirage d'échantillon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root {
  --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-300: #d1d5db; --gray-400: #9ca3af;
  --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827;
  --blue: #2563eb; --blue-dark: #1d4ed8; --switch: #3b5bdb;
  --red-50: #fef2f2; --red-700: #b91c1c; --yellow-50: #fefce8; --yellow-800: #854d0e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--gray-100); color: var(--gray-900);
  font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.hidden { display: none !important; }
main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgb(0 0 0 / .05); border: 1px solid var(--gray-200); }
.card + .card { margin-top: 24px; }
.card-head { padding: 20px 24px; border-bottom: 1px solid var(--gray-200); }
.card-head h1, .card-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.card-body { padding: 24px; }
.card-foot { padding: 16px 24px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 10px; align-items: center; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; }
.lab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.lab label { font-size: 15px; font-weight: 500; color: var(--gray-900); }
.lab .opt { color: var(--gray-400); white-space: nowrap; }
.info { display: inline-flex; vertical-align: super; margin-left: 4px; color: var(--gray-700); cursor: help; }
.info svg { width: 13px; height: 13px; }

.input { width: 100%; height: 48px; font: inherit; color: var(--gray-900); background: #fff;
  border: 1px solid var(--gray-300); border-radius: 8px; padding: 0 14px; }
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.input::placeholder { color: var(--gray-400); }
.input:disabled { background: var(--gray-100); color: var(--gray-400); cursor: not-allowed; }
select.input { appearance: none; padding-right: 40px; cursor: pointer;
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M7 8l3-3 3 3M7 12l3 3 3-3'/%3e%3c/svg%3e");
  background-repeat: no-repeat; background-position: right 12px center; background-size: 20px; }
select.input.vide { color: var(--gray-400); }
select.input option { color: var(--gray-900); }

.file { position: relative; display: flex; align-items: center; cursor: pointer; color: var(--gray-400); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.file.ok { color: var(--gray-900); }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file svg { width: 18px; height: 18px; margin-left: auto; flex-shrink: 0; color: var(--gray-500); }
.file span { overflow: hidden; text-overflow: ellipsis; }
.file.over { border-color: var(--blue); }

.switch { position: relative; display: inline-block; width: 58px; height: 32px; margin-top: 2px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--gray-200); border-radius: 99px; cursor: pointer; transition: background .15s; }
.switch span::after { content: ""; position: absolute; width: 24px; height: 24px; left: 4px; top: 4px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .15s; }
.switch input:checked + span { background: var(--switch); }
.switch input:checked + span::after { transform: translateX(26px); }
.switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 500; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-white { background: #fff; color: var(--gray-900); border-color: var(--gray-300); }
.btn-white:hover { background: var(--gray-50); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.alert { border-radius: 8px; padding: 12px 14px; font-size: 14px; white-space: pre-wrap; }
.alert.err { background: var(--red-50); color: var(--red-700); }
.alert.warn { background: var(--yellow-50); color: var(--yellow-800); }
.alert + .alert, .card-body > .alert:not(:first-child) { margin-top: 12px; }
.res-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.res-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.chiffres { color: var(--gray-500); font-size: 14px; margin-top: 2px; }
.table-wrap { overflow: auto; max-height: 440px; border: 1px solid var(--gray-200); border-radius: 8px; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: var(--gray-50); text-align: left; font-weight: 500; color: var(--gray-500); padding: 9px 12px; border-bottom: 1px solid var(--gray-200); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--gray-100); white-space: nowrap; color: var(--gray-700); }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

@media (max-width: 680px) {
  main { padding: 16px 16px 48px; }
  .grid { grid-template-columns: 1fr; }
  .card-head, .card-body, .card-foot { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<main>
  <form class="card" id="form" novalidate>
    <div class="card-head"><h1>Tirage d'échantillon</h1></div>
    <div class="card-body">
      <div id="loadErr"></div>
      <div class="grid">
        <div>
          <div class="lab"><label for="file">Base de sondage</label></div>
          <label class="input file" id="fileBox">
            <input type="file" id="file" accept=".csv,.txt,.xlsx,.xls,.ods">
            <span id="fileName">Sélectionner un fichier</span>
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13V4m0 0L6.5 7.5M10 4l3.5 3.5M4 13v1.5A1.5 1.5 0 0 0 5.5 16h9a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
          </label>
        </div>
        <div>
          <div class="lab"><label for="sheet">Feuille</label></div>
          <select class="input vide" id="sheet" disabled><option value="">Sélectionner la feuille</option></select>
        </div>

        <div>
          <div class="lab"><label for="methode">Type d'échantillonnage</label></div>
          <select class="input" id="methode">
            <option value="sas">Systématique à probabilités égales</option>
            <option value="pps">Systématique à probabilités inégales (PPT)</option>
            <option value="strat">Stratifié</option>
          </select>
        </div>
        <div>
          <div class="lab"><label for="taille">Taille de l'échantillon</label></div>
          <input class="input" type="number" id="taille" min="1" step="1" placeholder="n">
        </div>

        <div data-for="pps">
          <div class="lab"><label for="poids">Variable de taille</label></div>
          <select class="input colnum" id="poids" disabled></select>
        </div>

        <div data-for="strat">
          <div class="lab"><label for="strate">Variable de stratification</label></div>
          <select class="input colany" id="strate" disabled></select>
        </div>
        <div data-for="strat">
          <div class="lab"><label for="share">Allocation entre strates</label></div>
          <select class="input" id="share">
            <option value="0">Proportionnelle aux effectifs</option>
            <option value="1">Effectif × somme d'une variable</option>
          </select>
        </div>
        <div data-for="strat" id="allocBox">
          <div class="lab"><label for="allocVar">Variable d'allocation</label></div>
          <select class="input colnum" id="allocVar" disabled></select>
        </div>
        <div data-for="strat">
          <div class="lab"><label for="ppsStrate">Probabilités inégales dans les strates</label></div>
          <label class="switch"><input type="checkbox" id="ppsStrate"><span></span></label>
        </div>
        <div data-for="strat" id="poidsUBox">
          <div class="lab"><label for="poidsU">Variable de taille</label></div>
          <select class="input colnum" id="poidsU" disabled></select>
        </div>

        <div>
          <div class="lab"><label for="graine">Graine aléatoire<span class="info" title="La même graine redonne le même échantillon."><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM9 9a.75.75 0 0 0 0 1.5h.25v2.75a.75.75 0 0 0 1.5 0V9.75A.75.75 0 0 0 10 9H9z"/></svg></span></label></div>
          <input class="input" type="number" id="graine" step="1" value="42">
        </div>
        <div>
          <div class="lab"><label for="tri">Trier la base par<span class="info" title="En tirage systématique, l'ordre de la base compte."><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM9 9a.75.75 0 0 0 0 1.5h.25v2.75a.75.75 0 0 0 1.5 0V9.75A.75.75 0 0 0 10 9H9z"/></svg></span></label><span class="opt">Facultatif</span></div>
          <select class="input vide" id="tri" disabled><option value="">Sélectionner la colonne</option></select>
        </div>

        <div>
          <div class="lab"><label for="nomFichier">Nom du fichier de sortie</label><span class="opt">Facultatif</span></div>
          <input class="input" type="text" id="nomFichier" placeholder="echantillon">
        </div>
        <div>
          <div class="lab"><label for="format">Format du fichier de sortie</label></div>
          <select class="input" id="format">
            <option value="xlsx">.xlsx</option>
            <option value="csv">.csv</option>
            <option value="pdf">.pdf</option>
          </select>
        </div>
      </div>
      <div id="runMsg"></div>
    </div>
    <div class="card-foot">
      <button type="submit" class="btn btn-primary" id="run" disabled><span class="spin"></span>Chargement</button>
    </div>
  </form>

  <section class="card hidden" id="resultat">
    <div class="card-body">
      <div class="res-head">
        <div><h2 id="resTitre"></h2><div class="chiffres" id="resChiffres"></div></div>
        <button type="button" class="btn btn-white" id="dl">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v9m0 0l-3.5-3.5M10 13l3.5-3.5M4 15.5h12"/></svg>
          <span id="dlNom">Télécharger</span>
        </button>
      </div>
      <div id="logs"></div>
      <div class="table-wrap" id="strataTable"></div>
      <div class="table-wrap" id="sampleTable"></div>
    </div>
  </section>
</main>

<script type="text/x-python" id="pyGlue">
import sys, types, io, json, csv, contextlib
import pandas as pd
import numpy as np

# Le module importe matplotlib et seaborn sans s'en servir pour le tirage :
# on les remplace par des modules vides pour éviter de les télécharger.
for _m in ("matplotlib", "matplotlib.pyplot", "seaborn"):
    if _m not in sys.modules:
        sys.modules[_m] = types.ModuleType(_m)
sys.modules["matplotlib"].pyplot = sys.modules["matplotlib.pyplot"]

import echantillon as ech

BASE = None

def _finalise(df):
    df = df.reset_index(drop=True)
    df.insert(0, "ligne_base", np.arange(1, len(df) + 1))
    return df

def charger_csv(texte):
    global BASE
    echant = texte[:20000]
    try:
        sep = csv.Sniffer().sniff(echant, delimiters=",;\t|").delimiter
    except Exception:
        sep = ";" if echant.count(";") > echant.count(",") else ","
    BASE = _finalise(pd.read_csv(io.StringIO(texte), sep=sep, decimal="," if sep == ";" else "."))
    return _infos()

def charger_records(js):
    global BASE
    BASE = _finalise(pd.DataFrame(json.loads(js)))
    return _infos()

def _numerique(s):
    if s.dtype == object or str(s.dtype).startswith("str"):
        s = s.astype(str).str.replace(" ", "", regex=False).str.replace(" ", "", regex=False).str.replace(",", ".", regex=False)
    return pd.to_numeric(s, errors="coerce")

def _infos():
    cols = []
    for c in BASE.columns:
        if c == "ligne_base":
            continue
        num = _numerique(BASE[c])
        cols.append({"nom": str(c), "numerique": bool(num.notna().mean() > 0.9 and BASE[c].notna().any()),
                     "modalites": int(BASE[c].nunique())})
    return json.dumps({"n": len(BASE), "colonnes": cols,
                       "apercu": json.loads(BASE.head(5).to_json(orient="split", force_ascii=False, date_format="iso"))})

def tirer(params_js):
    p = json.loads(params_js)
    base = BASE.copy()
    for c in {p.get("poids"), p.get("poidsU"), p.get("allocVar")} - {None, ""}:
        base[c] = _numerique(base[c])
    if p.get("tri"):
        base = base.sort_values(p["tri"], kind="mergesort").reset_index(drop=True)

    taille = int(p["taille"])
    graine = int(p["graine"])
    sortie = io.StringIO()
    if p["methode"] == "strat" and base[p["strate"]].isna().any():
        manquants = int(base[p["strate"]].isna().sum())
        base = base[base[p["strate"]].notna()]
        print(f"{manquants} ligne(s) sans valeur pour la strate « {p['strate']} » ont été exclues de la base.", file=sortie)
    with contextlib.redirect_stdout(sortie):
        if p["methode"] == "sas":
            _, ech_df = ech.select_sys(base, taille, None, graine)
        elif p["methode"] == "pps":
            _, ech_df = ech.select_sys(base, taille, p["poids"], graine)
        else:
            poids_u = p["poidsU"] if p["tirageStrate"] == "pps" else None
            share = int(p["share"])
            poids = p["allocVar"] if share == 1 else None
            _, ech_df = ech.select_sys_complete(base, taille, p["strate"], poids_u=poids_u,
                                                poids=poids, random_state=graine, share=share)
    messages = sortie.getvalue().strip()

    ech_df = ech_df.copy()
    pps = p["methode"] == "pps" or (p["methode"] == "strat" and p["tirageStrate"] == "pps")
    strate = p["strate"] if p["methode"] == "strat" else None

    # Probabilités d'inclusion et poids de sondage
    if len(ech_df):
        if pps and "p_inclusion" in ech_df.columns:
            proba = ech_df["p_inclusion"].fillna(1.0).astype(float)
        elif pps:
            proba = pd.Series(1.0, index=ech_df.index)
        elif strate:
            N_h = base[strate].value_counts()
            n_h = ech_df[strate].value_counts()
            proba = ech_df[strate].map(lambda s: n_h[s] / N_h[s]).astype(float)
        else:
            proba = pd.Series(len(ech_df) / len(base), index=ech_df.index)
        ech_df["proba_inclusion"] = proba.round(8)
        ech_df["poids_sondage"] = (1 / proba).round(6)
    ech_df = ech_df.drop(columns=[c for c in ("id_sys", "p_inclusion", "cum_p_inclusion") if c in ech_df.columns])
    ech_df = ech_df.sort_values("ligne_base") if len(ech_df) else ech_df

    strates = None
    if strate:
        t = pd.DataFrame({"N_h": base[strate].value_counts(),
                          "n_h": ech_df[strate].value_counts() if len(ech_df) else 0}).fillna(0)
        t["n_h"] = t["n_h"].astype(int)
        t.index.name = "strate"
        strates = json.loads(t.reset_index().to_json(orient="split", force_ascii=False))

    return json.dumps({
        "N": len(base), "n": len(ech_df), "messages": messages, "strates": strates,
        "echantillon": json.loads(ech_df.to_json(orient="split", index=False, force_ascii=False, date_format="iso")),
        "somme_poids": float(ech_df["poids_sondage"].sum()) if len(ech_df) else 0.0,
    })
</script>

<script>
const $ = (id) => document.getElementById(id);
const MODULE_URLS = ["echantillon.py", "https://raw.githubusercontent.com/riozakies/echantillon/main/echantillon.py"];
const LIBELLES = { sas: "Systématique à probabilités égales", pps: "Systématique PPT", strat: "Stratifié" };
let py = null, pyOk = false, baseLoaded = false, workbook = null, fichierNom = "", resultat = null;

async function chargerModule() {
  for (const url of MODULE_URLS) {
    try { const r = await fetch(url, { cache: "no-cache" }); if (r.ok) return await r.text(); } catch (e) {}
  }
  throw new Error("impossible de récupérer echantillon.py");
}

const pyReady = (async () => {
  try {
    if (typeof loadPyodide !== "function") throw new Error("Pyodide n'a pas pu être téléchargé depuis cdn.jsdelivr.net.");
    py = await loadPyodide();
    await py.loadPackage(["pandas", "numpy"]);
    py.FS.writeFile("/home/pyodide/echantillon.py", await chargerModule());
    py.runPython("import sys; sys.path.insert(0, '/home/pyodide')");
    py.runPython($("pyGlue").textContent);
    pyOk = true;
  } catch (e) {
    console.error(e);
    $("loadErr").innerHTML = `<div class="alert err" style="margin-bottom:22px">Python n'a pas pu être chargé : ${esc(e.message || e)}</div>`;
  }
  $("run").innerHTML = "Lancer";
  majBouton();
})();

// ---------- Fichier ----------
const fileBox = $("fileBox");
fileBox.addEventListener("dragover", (e) => { e.preventDefault(); fileBox.classList.add("over"); });
fileBox.addEventListener("dragleave", () => fileBox.classList.remove("over"));
fileBox.addEventListener("drop", (e) => { e.preventDefault(); fileBox.classList.remove("over"); if (e.dataTransfer.files[0]) lireFichier(e.dataTransfer.files[0]); });
$("file").addEventListener("change", (e) => { if (e.target.files[0]) lireFichier(e.target.files[0]); });
$("sheet").addEventListener("change", () => chargerFeuille($("sheet").value));

async function lireFichier(f) {
  fichierNom = f.name;
  $("fileName").textContent = f.name; fileBox.classList.add("ok");
  $("runMsg").innerHTML = "";
  if (!$("nomFichier").value) $("nomFichier").placeholder = "echantillon_" + f.name.replace(/\.[^.]+$/, "");
  await pyReady;
  if (!pyOk) return;
  try {
    if (/\.(csv|txt)$/i.test(f.name)) {
      workbook = null;
      $("sheet").innerHTML = `<option value="">Sélectionner la feuille</option>`; $("sheet").disabled = true; $("sheet").classList.add("vide");
      afficherBase(py.globals.get("charger_csv")(await f.text()));
    } else {
      workbook = XLSX.read(await f.arrayBuffer(), { cellDates: true });
      $("sheet").innerHTML = workbook.SheetNames.map((s) => `<option>${esc(s)}</option>`).join("");
      $("sheet").disabled = false; $("sheet").classList.remove("vide");
      chargerFeuille(workbook.SheetNames[0]);
    }
  } catch (e) { erreurBase(e); }
}

function chargerFeuille(nom) {
  try {
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[nom], { defval: null, raw: true });
    if (!rows.length) throw new Error("la feuille est vide.");
    afficherBase(py.globals.get("charger_records")(JSON.stringify(rows)));
  } catch (e) { erreurBase(e); }
}

function erreurBase(e) {
  console.error(e); baseLoaded = false; majBouton();
  $("runMsg").innerHTML = `<div class="alert err" style="margin-top:22px">Lecture impossible : ${esc(pyErr(e))}</div>`;
}

function afficherBase(json) {
  const info = JSON.parse(json);
  baseLoaded = true;
  const opt = (c) => `<option value="${esc(c.nom)}">${esc(c.nom)}</option>`;
  const nums = info.colonnes.filter((c) => c.numerique);
  document.querySelectorAll("select.colnum").forEach((s) => {
    const prev = s.value;
    s.innerHTML = nums.map(opt).join("") || `<option value="">Aucune colonne numérique</option>`;
    if (nums.some((c) => c.nom === prev)) s.value = prev;
    s.disabled = !nums.length; s.classList.toggle("vide", !nums.length);
  });
  document.querySelectorAll("select.colany").forEach((s) => {
    s.innerHTML = info.colonnes.map(opt).join("");
    const pref = info.colonnes.find((c) => c.modalites > 1 && c.modalites <= 50);
    if (pref) s.value = pref.nom;
    s.disabled = false; s.classList.remove("vide");
  });
  $("tri").innerHTML = `<option value="">Aucun</option>` + info.colonnes.map(opt).join("");
  $("tri").disabled = false; $("tri").classList.remove("vide");
  $("taille").max = info.n;
  $("taille").placeholder = `n (base : ${info.n.toLocaleString("fr-FR")})`;
  majBouton();
}

// ---------- Formulaire ----------
function majFormulaire() {
  const m = $("methode").value;
  document.querySelectorAll("[data-for]").forEach((el) => el.classList.toggle("hidden", el.dataset.for !== m));
  if (m === "strat") {
    $("allocBox").classList.toggle("hidden", $("share").value !== "1");
    $("poidsUBox").classList.toggle("hidden", !$("ppsStrate").checked);
  }
}
["methode", "share", "ppsStrate"].forEach((id) => $(id).addEventListener("change", majFormulaire));
$("tri").addEventListener("change", () => $("tri").classList.toggle("vide", !$("tri").value));
document.querySelectorAll("select.colnum, select.colany").forEach((s) => { s.innerHTML = `<option value="">Sélectionner la colonne</option>`; s.classList.add("vide"); });
majFormulaire();
function majBouton() { $("run").disabled = !(pyOk && baseLoaded); }

function lireParams() {
  const m = $("methode").value, strat = m === "strat";
  return {
    methode: m, taille: parseInt($("taille").value, 10), graine: parseInt($("graine").value, 10) || 0,
    tri: $("tri").value ? [$("tri").value] : [],
    poids: m === "pps" ? $("poids").value : null,
    strate: strat ? $("strate").value : null,
    share: $("share").value, tirageStrate: $("ppsStrate").checked ? "pps" : "egal",
    poidsU: strat && $("ppsStrate").checked ? $("poidsU").value : null,
    allocVar: strat && $("share").value === "1" ? $("allocVar").value : null,
  };
}

$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const p = lireParams(), errs = [];
  if (!(p.taille >= 1)) errs.push("Indiquez la taille de l'échantillon.");
  if (p.methode === "pps" && !p.poids) errs.push("Choisissez une variable de taille.");
  if (p.methode === "strat" && p.tirageStrate === "pps" && !p.poidsU) errs.push("Choisissez une variable de taille.");
  if (p.methode === "strat" && p.share === "1" && !p.allocVar) errs.push("Choisissez la variable d'allocation.");
  if (errs.length) { $("runMsg").innerHTML = `<div class="alert err" style="margin-top:22px">${errs.map(esc).join("\n")}</div>`; return; }
  $("runMsg").innerHTML = "";
  $("run").disabled = true; $("run").innerHTML = '<span class="spin"></span>Lancer';
  setTimeout(() => {
    try {
      resultat = JSON.parse(py.globals.get("tirer")(JSON.stringify(p)));
      resultat.params = p; resultat.date = new Date(); resultat.fichier = fichierNom;
      afficherResultat();
    } catch (e) {
      console.error(e);
      $("runMsg").innerHTML = `<div class="alert err" style="margin-top:22px">${esc(pyErr(e))}</div>`;
    } finally { $("run").innerHTML = "Lancer"; majBouton(); }
  }, 30);
});

function afficherResultat() {
  const r = resultat;
  $("resultat").classList.remove("hidden");
  $("resTitre").textContent = `${r.n.toLocaleString("fr-FR")} unités tirées`;
  $("resChiffres").textContent = `sur ${r.N.toLocaleString("fr-FR")} · taux ${(100 * r.n / r.N).toLocaleString("fr-FR", { maximumFractionDigits: 2 })} % · somme des poids ${Math.round(r.somme_poids).toLocaleString("fr-FR")}`;
  $("logs").innerHTML = r.messages ? `<div class="alert ${r.n ? "warn" : "err"}" style="margin-top:16px">${esc(r.messages)}</div>` : "";
  $("dl").disabled = !r.n;
  $("strataTable").classList.toggle("hidden", !r.strates);
  if (r.strates) $("strataTable").innerHTML = tableHTML(r.strates.columns, r.strates.data);
  $("sampleTable").classList.toggle("hidden", !r.n);
  $("sampleTable").innerHTML = r.n ? tableHTML(r.echantillon.columns, r.echantillon.data) : "";
  majNom();
  $("resultat").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---------- Export ----------
function nomFichier() {
  const ext = $("format").value;
  const brut = $("nomFichier").value.trim() || $("nomFichier").placeholder || "echantillon";
  const n = brut.replace(/[\\/:*?"<>|]+/g, "_").replace(/\.(xlsx|csv|pdf)$/i, "");
  return (n || "echantillon") + "." + ext;
}
function majNom() { $("dlNom").textContent = nomFichier(); }
$("nomFichier").addEventListener("input", majNom);
$("format").addEventListener("change", majNom);

$("dl").addEventListener("click", () => {
  const ext = $("format").value;
  if (ext === "xlsx") exportXlsx(); else if (ext === "csv") exportCsv(); else exportPdf();
});
function exportXlsx() {
  const r = resultat, { columns, data } = r.echantillon;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([columns, ...data]), "Echantillon");
  if (r.strates) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([r.strates.columns, ...r.strates.data]), "Strates");
  XLSX.writeFile(wb, nomFichier());
}
function exportCsv() {
  const { columns, data } = resultat.echantillon;
  const cell = (v) => {
    if (v === null || v === undefined) return "";
    const s = typeof v === "number" ? String(v).replace(".", ",") : String(v);
    return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [columns, ...data].map((r) => r.map(cell).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = nomFichier(); document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportPdf() {
  const { jsPDF } = window.jspdf;
  const r = resultat, p = r.params;
  const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
  doc.setFontSize(15); doc.setTextColor(17, 24, 39); doc.text(nomFichier().replace(/\.pdf$/, ""), 40, 40);
  doc.setFontSize(9); doc.setTextColor(75, 85, 99);
  const lignes = [
    `Méthode : ${LIBELLES[p.methode]}` + (p.poids ? ` (variable de taille : ${p.poids})` : ""),
    p.strate ? `Strates : ${p.strate} ; allocation ${p.share === "1" ? "N_h × somme de " + p.allocVar : "proportionnelle aux effectifs"} ; tirage ${p.tirageStrate === "pps" ? "PPT selon " + p.poidsU : "à probabilités égales"}` : null,
    `Base : ${r.fichier} ; taille demandée : ${p.taille} ; unités tirées : ${r.n} sur ${r.N} ; graine : ${p.graine}` + (p.tri.length ? ` ; tri : ${p.tri.join(", ")}` : ""),
    `Tirage du ${r.date.toLocaleString("fr-FR")}`,
  ].filter(Boolean);
  lignes.forEach((l, i) => doc.text(l, 40, 58 + i * 12));
  const fmtCell = (v) => v === null || v === undefined ? "" : typeof v === "number" ? v.toLocaleString("fr-FR", { maximumFractionDigits: 4 }).replace(/ /g, " ") : String(v);
  const style = { headStyles: { fillColor: [37, 99, 235] }, alternateRowStyles: { fillColor: [249, 250, 251] } };
  doc.autoTable({ ...style, head: [r.echantillon.columns], body: r.echantillon.data.map((row) => row.map(fmtCell)),
    startY: 62 + lignes.length * 12, styles: { fontSize: r.echantillon.columns.length > 12 ? 5.5 : 7, cellPadding: 2 }, margin: { left: 30, right: 30 } });
  if (r.strates) doc.autoTable({ ...style, head: [r.strates.columns], body: r.strates.data.map((row) => row.map(fmtCell)),
    startY: doc.lastAutoTable.finalY + 20, styles: { fontSize: 8 }, tableWidth: 300, margin: { left: 30 } });
  doc.save(nomFichier());
}

// ---------- Utilitaires ----------
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function pyErr(e) { const m = String(e.message || e); const lines = m.trim().split("\n"); return lines[lines.length - 1]; }
function tableHTML(cols, rows) {
  const td = (v) => typeof v === "number" ? `<td class="n">${v.toLocaleString("fr-FR", { maximumFractionDigits: 6 })}</td>` : `<td>${v === null ? "" : esc(v)}</td>`;
  return `<table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map(td).join("")}</tr>`).join("")}</tbody></table>`;
}
</script>
</body>
</html>
